<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 230" fill="none">
  <defs>
    <linearGradient id="thermoGlass" x1="23" x2="47" y1="18" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfeff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#dff2ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#88c2e9" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="thermoMercury" x1="35" x2="35" y1="34" y2="197" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb691"/>
      <stop offset="0.4" stop-color="#ff7d4f"/>
